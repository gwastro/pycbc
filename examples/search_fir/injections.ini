[variable_params]
mchirp =
q =
spin1z =
spin2z =
distance =
inclination =
polarization =
coa_phase =
ra =
dec =

[static_params]
approximant = TaylorF2
f_lower = 20.0
f_final = 800.0
spin1x = 0.0
spin1y = 0.0
spin2x = 0.0
spin2y = 0.0

[prior-mchirp]
name = uniform
min-mchirp = 1.19
max-mchirp = 1.3

[prior-q]
name = uniform
min-q = 1
max-q = 2

[prior-spin1z]
name = uniform
min-spin1z = -0.1
max-spin1z = 0.1

[prior-spin2z]
name = uniform
min-spin2z = -0.1
max-spin2z = 0.1

[waveform_transforms-mass1+mass2]
name = custom
inputs = mchirp, q
mass1 = mass1_from_mchirp_q(mchirp, q)
mass2 = mass2_from_mchirp_q(mchirp, q)

[prior-distance]
name = uniform
min-distance = 10
max-distance = 250

[prior-inclination]
name = sin_angle

[prior-polarization]
name = uniform_angle

[prior-coa_phase]
name = uniform_angle

[prior-ra+dec]
name = uniform_sky
