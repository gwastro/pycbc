[workflow-injections]
injections-method = PREGENERATED
injections-pregenerated-file = ${resolve:./injections.hdf}
compute-optimal-snr =

[workflow-optimal-snr]
parallelization-factor = 2

[inspiral]
injection-filter-rejector-chirp-time-window = 5

[optimal_snr]
f-low = ${inspiral|low-frequency-cutoff}
seg-length = ${inspiral|segment-length}
sample-rate = 2048
cores = 1

[optimal_snr_merge]

[workflow-injections-bns]

[injections-bns]
