[common]
max_ns_mass = 2.8346

[variable_params]
mass1 =
mass2 =
spin1z =
spin2z =
inclination =
distance =
tc =
dec =
ra =
coa_phase = 
polarization =

[static_params]
approximant = IMRPhenomXP
f_lower = 20.0
f_ref = 20.
phi_ref = 0.

[prior-coa_phase]
name = uniform_angle

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[constraint-inclination]
name = custom
constraint_arg = (inclination <= radians(30)) | (inclination >= radians(150))

[prior-mass1]
name = gaussian
min-mass1 = 1.0
max-mass1 = 3.0
mass1_mean = 1.4
mass1_var = 0.2

[prior-mass2]
name = gaussian
min-mass2 = 1.0
max-mass2 = 3.0
mass2_mean = 1.4
mass2_var = 0.2

[prior-distance]
name = uniform
min-distance = ${workflow-injections|min-nsns-distance} 
max-distance = ${workflow-injections|max-nsns-distance}

[constraint-mass_order]
name = custom
constraint_arg = mass2 <= mass1

[prior-spin1z]
name = uniform
min-spin1z = -0.05
max-spin1z = 0.05

[prior-spin2z]
name = uniform
min-spin2z = -0.05
max-spin2z = 0.05
