[variable_params]
inclination =
distance =
tc =
dec =
ra =
coa_phase = 
polarization =

[static_params]
approximant = IMRPhenomXP
f_lower = 20.0
f_ref = 20.
phi_ref = 0.
mass1 = 1.47475
mass2 = 1.28334
spin1x = 0
spin1y = 0
spin1z = 0
spin2x = 0
spin2y = 0
spin2z = 0

[prior-coa_phase]
name = uniform_angle

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[constraint-inclination]
name = custom
constraint_arg = (inclination <= radians(30)) | (inclination >= radians(150))

[prior-distance]
name = uniform
min-distance = ${workflow-injections|min-nsns-distance} 
max-distance = ${workflow-injections|max-nsns-distance}
