[workflow-postproc]
postproc-method = PYGRB_OFFLINE

[trig_combiner]
num-trials = 6

[trig_cluster&inj_finder]
time-window = 0.1
rank-column = reweighted_snr
verbose =

[pegasus_profile]

[executables]
pygrb_results_workflow = ${which:pycbc_pygrb_results_workflow}
pygrb_plot_skygrid = ${which:pycbc_pygrb_plot_skygrid}
pygrb_grb_info_table = ${which:pycbc_pygrb_grb_info_table}
pygrb_plot_snr_timeseries = ${which:pycbc_pygrb_plot_snr_timeseries}
pygrb_plot_chisq_veto = ${which:pycbc_pygrb_plot_chisq_veto}
pygrb_plot_coh_ifosnr = ${which:pycbc_pygrb_plot_coh_ifosnr}
pygrb_plot_null_stats = ${which:pycbc_pygrb_plot_null_stats}
pygrb_plot_injs_results = ${which:pycbc_pygrb_plot_injs_results}
pycbc_plot_bank_corner = ${which:pycbc_plot_bank_corner}
pygrb_plot_stats_distribution = ${which:pycbc_pygrb_plot_stats_distribution}
pygrb_page_tables = ${which:pycbc_pygrb_page_tables}
pygrb_efficiency = ${which:pycbc_pygrb_efficiency}
pygrb_exclusion_dist_table = ${which:pycbc_pygrb_exclusion_dist_table}
pygrb_minifollowups = ${which:pycbc_pygrb_minifollowups}
plot_qscan = ${which:pycbc_plot_qscan}
results_page = ${which:pycbc_make_html_page}
page_versioning = ${which:pycbc_page_versioning}

[workflow-pygrb_results_workflow]
verbose =
veto-category = 3
tuning-inj-set = nsns

[pygrb_results_workflow]

[results_page]
analysis-title = 'GRB ${workflow|trigger-name}'
analysis-subtitle = 'Testing PyGRB'
verbose = 

[pygrb_plot_skygrid]

[pygrb_grb_info_table]
input-dist = ${workflow|input-dist}
trigger-time = ${workflow|trigger-time}

[pygrb_plot_snr_timeseries&pygrb_plot_chisq_veto&pygrb_plot_coh_ifosnr&pygrb_plot_null_stats&pygrb_plot_injs_results&pygrb_efficiency&pygrb_page_tables&pygrb_minifollowups]
verbose =
newsnr-threshold = 6.

[pygrb_plot_snr_timeseries&pygrb_plot_chisq_veto&pygrb_plot_coh_ifosnr&pygrb_plot_null_stats&pygrb_plot_stats_distribution&pygrb_efficiency&pygrb_page_tables]
slide-id = all

; Subsection order determines the menu order on the results webpage
[pygrb_plot_snr_timeseries-single]

[pygrb_plot_snr_timeseries-coherent]

[pygrb_plot_snr_timeseries-null]

[pygrb_plot_snr_timeseries-reweighted]

[pygrb_plot_chisq_veto]
chisq-index = ${inspiral|chisq-index}
chisq-nhigh = ${inspiral|chisq-nhigh}
use-logs =

; Subsection order determines the menu order on the results webpage
[pygrb_plot_chisq_veto-network]

[pygrb_plot_chisq_veto-power]
snr-type = single

[pygrb_plot_null_stats]
null-snr-threshold = ${inspiral|null-min}
null-grad-thresh = ${inspiral|null-step}
null-grad-val = ${inspiral|null-grad}
y-lims = 0,10

[pycbc_plot_bank_corner]

[pycbc_plot_bank_corner-injs]
parameters = inclination polarization coa_phase spin1z spin2z

[pycbc_plot_bank_corner-bank]
parameters = mass1 mass2 spin1z spin2z

; Subsection order determines the menu order on the results webpage
[pygrb_plot_null_stats-null]

[pygrb_plot_null_stats-coincident]

; Subsection order determines the menu order on the results webpage
[pygrb_plot_injs_results-distance_mchirp]
y-log =

[pygrb_plot_injs_results-distance_endtime]
y-log =

[pygrb_plot_injs_results-mchirp_incl]

[pygrb_plot_injs_results-distance_cosincl]
y-log =

[pygrb_plot_injs_results-mtotal_q]

[pygrb_plot_injs_results-skyerror_distance]
x-log =

[pygrb_plot_injs_results-skyerror_mchirp]

[pygrb_plot_injs_results-skyerror_endtime]

[pygrb_plot_injs_results-spin2a_spin1a]

[pygrb_plot_injs_results-netoptsnr_distance]
x-log = 
y-log = 

[pygrb_plot_injs_results-netoptsnr_mchirp]
y-log = 

[pygrb_plot_injs_results-netoptsnr_endtime] 
y-log =

[pygrb_plot_stats_distribution]
; Pass this also to page-tables
;seed = ${common|seed}

[pygrb_plot_stats_distribution-bestnr]

[pygrb_plot_stats_distribution-snr]

[pygrb_plot_stats_distribution-snraftercuts]

[pygrb_efficiency&pygrb_page_tables]
glitch-check-factor = 1.05
cluster-window = 0.1

[pygrb_efficiency]
num-mc-injections = 100
num-bins = 25

[pygrb_efficiency-nsns]
lower-inj-dist = ${workflow-injections|min-nsns-distance} 
upper-inj-dist = ${workflow-injections|max-nsns-distance}

[pygrb_exclusion_dist_table]

[pegasus_profile-plot_qscan]
; Not sure the next option is worth it
;pegasus|clusters.size = 5
; This one is prudent to have
condor|+InitialRequestMemory = 3000

[plot_qscan]
time-windows = 70,5 10,1 1,1
strain-high-pass = ${inspiral|strain-high-pass}
sample-rate = ${inspiral|sample-rate}
pad-data = ${inspiral|pad-data}

[plot_qscan-h1]
channel-name = ${workflow|h1-channel-name}
frame-type = ${workflow-datafind|datafind-h1-frame-type}

[plot_qscan-l1]
channel-name = ${workflow|l1-channel-name}
frame-type = ${workflow-datafind|datafind-l1-frame-type}

[workflow-minifollowups]
num-events = 2

[page_versioning]
