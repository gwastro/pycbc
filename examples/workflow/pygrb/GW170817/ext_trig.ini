[workflow]
trigger-name = 170817A
trigger-time = 1187008884
start-time = 1187002884
end-time = 1187014884
; You can use units (deg or rad) for the angles,
; but separate the value from the unit with a single space.
ra = 3.4452799434368067 rad
dec = -0.40840704496667307 rad
sky-error = 1 deg
input_dist = FisherSky(mean_ra="3.4452799434368067 rad", mean_dec="-0.40840704496667307 rad", sigma="1 deg")

[workflow-injections]
max-nsns-distance = 500
min-nsns-distance = 10
nsns-config-files = injection_params.ini, ext_trig.ini

[inj_efficiency]
h1-dc-cal-error = 1
l1-dc-cal-error = 1
v1-dc-cal-error = 1
waveform-error = 0
h1-cal-error = 1
l1-cal-error = 1
v1-cal-error = 1

[prior-ra+dec]
name = fisher_sky
mean_ra = ${workflow|ra}
mean_dec = ${workflow|dec}
sigma = ${workflow|sky-error}

[injections-nsns&workflow-injections-nsns]
ninjections = 500
