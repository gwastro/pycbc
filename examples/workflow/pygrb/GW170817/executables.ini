[executables]
inspiral = ${which:pycbc_multi_inspiral}
splitbank = ${which:pycbc_hdf5_splitbank}
trig_combiner = ${which:pycbc_grb_trig_combiner}
trig_cluster = ${which:pycbc_grb_trig_cluster}
injections = ${which:pycbc_create_injections}
split_inspinj = ${which:pycbc_hdf_splitinj}
inj_finder = ${which:pycbc_grb_inj_finder}
make_sky_grid = ${which:pycbc_make_sky_grid}
optimal_snr = ${which:pycbc_optimal_snr}
optimal_snr_merge = ${which:pycbc_merge_inj_hdf}
calculate_psd = ${which:pycbc_calculate_psd}

[pegasus_profile]
; Memory default units: MB
; Disk default units: KB
condor|+InitialRequestMemory = 2*1024
pycbc|installed = True
pycbc|primary_site = condorpool_symlink
condor|request_memory = ifThenElse((LastHoldReasonCode=!=34 && LastHoldReasonCode=!=26), InitialRequestMemory, int(1.5 * NumJobStarts * MemoryUsage))
condor|+InitialRequestDisk = 2*1024*1024
condor|request_disk = int(1.5 * DiskUsage + InitialRequestDisk)
# Set ExpectedMaxRunTime in units of seconds
condor|+ExpectedMaxRunTime = 10*3600
# Hold jobs that run longer than ExpectedMaxRunTime plus 10 minutes
condor|periodic_hold = (JobStatus =?= 2) && ((CurrentTime - EnteredCurrentStatus) > (ExpectedMaxRunTime * NumJobStarts + 600))
# If jobs are held for these reasons, restart them after 5 minutes.
# This should allow the increasing resource requests to work.
# See https://htcondor.readthedocs.io/en/latest/classad-attributes/job-classad-attributes.html#HoldReasonCode
#
# Reason codes used here:
# 26 - CIT code for memory usage
# 21 - Condor put the job on hold
# 34 - Memory usage exceeded
# 32 & 33 - Disk usage exceeded
# 34 - Job out of resources
# 3 - Periodic hold condition evaluated to true
condor|periodic_release = ((HoldReasonCode =?= 26) || (HoldReasonCode =?= 21) || (HoldReasonCode =?= 34) || (HoldReasonCode =?= 32) || (HoldReasonCode =?= 33) || ((JobStatus =?= 5) && (HoldReasonCode =?= 3))) && ((CurrentTime - EnteredCurrentStatus) > (300))
# Remove problematic jobs after being held for 5 minutes.
# This also removes jobs that have been restarted more than 5 times.
# 
# Reason codes used here:
# 12 & 13 - File transfer errors
condor|periodic_remove = ((HoldReasonCode =?= 12) || (HoldReasonCode =?= 13) || (NumJobStarts >= 5)) && ((CurrentTime - EnteredCurrentStatus) > (300))

[pegasus_profile-condorpool_shared&pegasus_profile-condorpool_symlink&pegasus_profile-osg]
; Always disable HDF file locking (though only important on condorpool_symlink)
env|HDF5_USE_FILE_LOCKING = FALSE

[pegasus_profile-condorpool_shared&pegasus_profile-condorpool_symlink]
; Force CIT's local datafind server (needs tweaking if using elsewhere)
env|GWDATAFIND_SERVER = datafind.ldas.cit:80

[pegasus_profile-osg]
; Explicitly ensure the correct datafind server is set on OSG
env|GWDATAFIND_SERVER=datafind.ligo.org:443

[pegasus_profile-condorpool_symlink]

[pegasus_profile-splitbank]
condor|priority = 800

[pegasus_profile-injections]
condor|priority = 700

[pegasus_profile-split_inspinj]
condor|priority = 700

[pegasus_profile-inspiral]
condor|+InitialRequestMemory = 4*1024
condor|+InitialRequestDisk = 10*1024*1024
condor|priority = 500

[pegasus_profile-trig_combiner]
condor|+InitialRequestDisk = 10*1024*1024
condor|+InitialRequestMemory = 75*1024
condor|priority = 800

[pegasus_profile-trig_cluster]
condor|+InitialRequestDisk = 10*1024*1024
condor|+InitialRequestMemory = 75*1024
condor|priority = 800

[pegasus_profile-inj_finder]
condor|+InitialRequestDisk = 10*1024*1024
condor|+InitialRequestMemory = 75*1024
condor|priority = 800

[pegasus_profile-calculate_psd]
condor|+InitialRequestMemory = 5*1024
condor|priority = 800
