[workflow]
file-retention-level = all_files
allow-single-ifo-search =

h1-channel-name = H1:GWOSC-4KHZ_R1_STRAIN
l1-channel-name = L1:GWOSC-4KHZ_R1_STRAIN

frame-cache-h1 = ${resolve:./strain_H1.lcf}
frame-cache-l1 = ${resolve:./strain_L1.lcf}

[workflow-ifos]
h1 =
l1 =

[workflow-datafind]
datafind-method = AT_RUNTIME_FAKE_DATA

[workflow-inspiral]

[workflow-segments]
segments-science = +DATA,-CBC_CAT1_VETO
;segments-vetoes = +CBC_CAT2_VETO,+CBC_HW_INJ,+BURST_HW_INJ

[workflow-exttrig_segments]
on-before = 5
on-after = 1
min-duration = 1664
max-duration = 5632
quanta = 128
num-buffer-before = 16
num-buffer-after = 16

[make_sky_grid]
trigger-time = ${workflow|trigger-time}
timing-uncertainty = 0.0001
coverage = 0.9
input-dist = ${workflow|input-dist}

[inspiral]

frame-cache = H1:${workflow|frame-cache-h1} L1:${workflow|frame-cache-l1}

; conditioning high-pass filter
strain-high-pass = 18

; working sample rate for matched filtering
sample-rate = 1024

; segmentation of the data
segment-length = 512
; start-pad must be long enough to contain the longest template in the bank
segment-start-pad = 194
segment-end-pad = 16

; estimation of the noise PSD and construction of the whitening filter
; segment-length = psd-segment-length + (psd-num-segments - 1) * psd-segment-stride
psd-estimation = median
psd-segment-length = 16
psd-segment-stride = 8
psd-num-segments = 63
psd-inverse-length = 16

; autogating configuration
autogating-threshold = 50
autogating-cluster = 0.1 
autogating-width = 0.25
autogating-taper = 0.25
autogating-pad = 16
autogating-max-iterations = 5

low-frequency-cutoff = 23
approximant = IMRPhenomD
order = -1

; method for clustering triggers over time
; Do not change method
cluster-method = window
cluster-window = 0.1

; Signal-based discriminators.
chisq-bins = "0.72*get_freq('fIMRPhenomDPeak',params.mass1,params.mass2,params.spin1z,params.spin2z)**0.7"
sngl-snr-threshold = 3.5
coinc-threshold = 4
chisq-index = 6.0
chisq-nhigh = 2.0
do-null-cut =
null-min = 5.25
null-grad = 0.2
null-step = 20.

; options for reducing the computational cost and storage
processing-scheme = mkl

[inspiral-coherent_no_injections]
projection = left+right
; Short timeslides
slide-shift = 6
do-shortslides =

[inspiral&workflow-exttrig_segments]
pad-data = 8

[workflow-tmpltbank]
tmpltbank-method = PREGENERATED_BANK
tmpltbank-pregenerated-bank = ${resolve:./gw170817_single_template.hdf}

[workflow-splittable]
splittable-method = IN_WORKFLOW

[workflow-splittable-inspiral]
splittable-num-banks = 1
splittable-exe-tag = splitbank

[workflow-matchedfilter]
matchedfilter-method = WORKFLOW_MULTIPLE_IFOS

[splitbank]
; When splitting the bank and the injection sets, shuffle their order so as to
; even out the amount of work that each inspiral-injection job has to do.  The
; value of the random seed is not important, but its presence keeps the same
; randomization across different workflow runs.
random-sort =
random-seed = 12345678

[optimal_snr_merge]

; Parameters for optimal SNR plots configuration
[calculate_psd]
low-frequency-cutoff = ${inspiral|low-frequency-cutoff}
pad-data = ${inspiral|pad-data}
psd-estimation = ${inspiral|psd-estimation}
psd-segment-length = ${inspiral|psd-segment-length}
psd-segment-stride = ${inspiral|psd-segment-stride}
psd-num-segments = ${inspiral|psd-num-segments}
psd-inverse-length = ${inspiral|psd-inverse-length}
strain-high-pass = ${inspiral|strain-high-pass}
sample-rate = ${inspiral|sample-rate}
segment-length = ${inspiral|segment-length}
segment-start-pad = ${inspiral|segment-start-pad}
segment-end-pad = ${inspiral|segment-end-pad}
autogating-threshold = ${inspiral|autogating-threshold}
autogating-cluster = ${inspiral|autogating-cluster}
autogating-width = ${inspiral|autogating-width}
autogating-taper = ${inspiral|autogating-taper}
autogating-pad = ${inspiral|autogating-pad}

[calculate_psd-h1]
channel-name = ${workflow|h1-channel-name}
frame-cache = ${workflow|frame-cache-h1}

[calculate_psd-l1]
channel-name = ${workflow|l1-channel-name}
frame-cache = ${workflow|frame-cache-l1}
