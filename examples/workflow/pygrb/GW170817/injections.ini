[workflow-injections]
injections-method = IN_WORKFLOW
; Ensure that the coalescence times of the injections are calculated upon
; generating the workflow, based on the analysis time window
tc-prior-at-runtime =

[injections]

[inspiral-sngl_injections&inspiral-coherent_injections]
; This saves time in injection inspiral jobs by avoiding filtering
; an injection with templates that have very different parameters
injection-filter-rejector-chirp-time-window = 5
; Save time by only processing triggers near injection times
injection-filter-rejector-trigger-window = 2

[inspiral-coherent_injections]
projection = left+right

[workflow-splittable-injections]
splittable-num-banks = 1
splittable-exe-tag = splitbank

[workflow-splittable-split_inspinj]
splittable-exe-tag = split_inspinj
splitinjtable-interval = 400

[split_inspinj]

[workflow-optimal-snr]
parallelization-factor = 5

[optimal_snr]
verbose =
