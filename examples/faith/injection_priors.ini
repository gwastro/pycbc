[variable_params]
mass1 =
mass2 =
spin1z =
spin2z =

[prior-mass1]
name = uniform
min-mass1 = 50
max-mass1 = 150

[prior-mass2]
name = uniform
min-mass2 = 50
max-mass2 = 150

[prior-spin1z]
name = uniform
min-spin1z = 0
max-spin1z = 1

[prior-spin2z]
name = uniform
min-spin2z = 0
max-spin2z = 1

[constraint-mtotal]
name = custom
constraint_arg = ((mass1 + mass2) < 300) & ((mass1 + mass2) > 100)

[static_params]
; Only used to pick the HDF injection table schema when writing out the
; injection set; the actual approximants compared are set in
; [pycbc_faithsim] (waveform1-approximant/waveform2-approximant).
approximant = SEOBNRv4
f_lower = 20
distance = 1000
inclination = 0
coa_phase = 0
ra = 0
dec = 0
polarization = 0
