; Parameter distributions for the injection set live in a separate,
; standard PyCBC distributions config file (see injection_priors.ini),
; not here. This section only controls the density/jitter of injections
; in time.
[injection]
config-files = ./injection_priors.ini
time-step = 1
time-window = 0

[executables]
; Defaults to HDF for the injection set (pycbc_create_injections +
; pycbc_hdf_splitinj). For XML instead, use lalapps_inspinj + either
; pycbc_split_inspinj or pycbc_splitbank for injsplit.
injection = ${which:pycbc_create_injections}
injsplit = ${which:pycbc_hdf_splitinj}
pycbc_faithsim = ${which:pycbc_faithsim}
pycbc_faithsim_collect_results = ${which:pycbc_faithsim_collect_results}
pycbc_faithsim_plots = ${which:pycbc_faithsim_plots}

[workflow]
file-retention-level = all_triggers
start-time = 1000000000
end-time = 1000001000

[splitbank]
num_banks = 10

[injsplit]

[pycbc_faithsim_collect_results]

[pycbc_faithsim]
psd-model = aLIGOZeroDetHighPower
waveform1-approximant = IMRPhenomXAS
waveform1-start-frequency = 14
waveform2-approximant = SEOBNRv4_opt
waveform2-start-frequency = 14
filter-low-frequency-cutoff = 20
filter-sample-rate = 16384
filter-waveform-length = 1024

[pycbc_faithsim_plots]
colormap = viridis

[pycbc_faithsim_plots-mass1_mass2_time_offset]
parameter-x = mass1
parameter-y = mass2
parameter-z = time_offset

[pycbc_faithsim_plots-mass_ratio_spin1z_match]
parameter-x = mass_ratio
parameter-y = spin1z
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-mass_ratio_spin1_magnitude_match]
parameter-x = mass_ratio
parameter-y = spin1_magnitude
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-mass_ratio_spin2z_match]
parameter-x = mass_ratio
parameter-y = spin2z
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-mass_ratio_spin2_magnitude_match]
parameter-x = mass_ratio
parameter-y = spin2_magnitude
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-mass_ratio_mtotal_match]
parameter-x = mass_ratio
parameter-y = total_mass
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-mass1_mass2_match]
parameter-x = mass1
parameter-y = mass2
parameter-z = match
vmin = 0
vmax = 1

[pycbc_faithsim_plots-coa_phase_match_mchirp]
parameter-x = coa_phase
parameter-y = match
parameter-z = mchirp
ymin=0

[pycbc_faithsim_plots-inclination_match_mchirp]
parameter-x = inclination
parameter-y = match
parameter-z = mchirp

[pycbc_faithsim_plots-inclination_sigma1_mchirp]
parameter-x = inclination
parameter-y = sigma1
parameter-z = mchirp

[pycbc_faithsim_plots-inclination_sigma2_mchirp]
parameter-x = inclination
parameter-y = sigma2
parameter-z = mchirp

[pegasus_profile]
condor|accounting_group = ligo.dev.o4.cbc.bbh.pycbcoffline
condor|request_disk = 2.1G
condor|request_memory = 3000
pycbc|primary_site = condorpool_symlink
condor|request_cpus = 1

