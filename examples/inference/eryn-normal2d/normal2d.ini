[model]
name = test_normal

[sampler]
name = eryn
nwalkers = 200
ntemps = 4
effective-nsamples = 1000
checkpoint-interval = 500
max-samples-per-chain = 1000

; Optional: expose eryn's proposal (moves) schedule. A space-separated list of
; MoveClass[:weight] entries naming classes in eryn.moves. Keyword arguments
; for a move go in a [eryn_move-MoveClass] section. Omit to use eryn's default
; (a single StretchMove).
moves = StretchMove:1.0

[eryn_move-StretchMove]
a = 2.0

[sampler-burn_in]
burn-in-test = nacl


[variable_params]
x =
y =

[prior-x]
name = uniform
min-x = -10
max-x = 10

[prior-y]
name = uniform
min-y = -10
max-y = 10
