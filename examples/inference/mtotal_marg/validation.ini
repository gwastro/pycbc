; The same analysis as mtotal_marg.ini, but with the base model sampling the
; total mass directly instead of marginalizing over it. The two should agree
; on both the evidence and the posteriors of the remaining parameters.
[model]
name = marginalized_time
low-frequency-cutoff = 20.0

marginalize_vector_params = tc, ra, dec, polarization
marginalize_vector_samples = 500

; You shouldn't use phase marginalization if the approximant has
; higher-order modes
marginalize_phase = True

marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_snr_range = 5, 50
marginalize_distance_density = 100, 100
marginalize_distance_samples = 1000

[data]
instruments = H1 L1
trigger-time = 1126259462.43
analysis-start-time = -4
analysis-end-time = 1
psd-estimation = median-mean
psd-start-time = -256
psd-end-time = 256
psd-inverse-length = 8
psd-segment-length = 8
psd-segment-stride = 4
injection-file = injection.hdf
fake-strain = aLIGOZeroDetLowPower
fake-strain-sample-rate = 2048
channel-name = H1:GWOSC-4KHZ_R1_STRAIN L1:GWOSC-4KHZ_R1_STRAIN
sample-rate = 2048
strain-high-pass = 15
pad-data = 8

[sampler]
name = dynesty
dlogz = 1.0
nlive = 200

[variable_params]
mtotal =
q =
inclination =
distance =
polarization =
ra =
dec =
tc =

[static_params]
approximant = IMRPhenomD
f_lower = 20
spin1z = 0
spin2z = 0

[waveform_transforms-mass1]
name = custom
inputs = mtotal, q
mass1 = mass1_from_mtotal_q(mtotal, q)

[waveform_transforms-mass2]
name = custom
inputs = mtotal, q
mass2 = mass2_from_mtotal_q(mtotal, q)

[prior-mtotal]
name = uniform
min-mtotal = 40
max-mtotal = 80

[prior-q]
name = uniform
min-q = 1
max-q = 3

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[prior-tc]
name = uniform
min-tc = 1126259462.35
max-tc = 1126259462.45

[prior-distance]
; following gives a uniform in volume
name = uniform_radius
min-distance = 100
max-distance = 3000

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle
