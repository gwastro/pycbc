[model]
name = marginalized_mtotal
low-frequency-cutoff = 20.0

; The total mass marginalization rescales a reference waveform and hands the
; result to a base model, so the base model has to accept a pre-generated
; waveform. At present only the marginalized_time model does.
base_model = marginalized_time

; Turn on the brute force marginalization over the total mass. The grid is
; placed uniformly across the mtotal prior bounds; give either mtotal_grid_num
; (number of points) or mtotal_grid (an explicit list of total masses).
;
; The grid has to resolve the peak of the likelihood, which gets narrower as
; the signal gets louder. 80 points across the 40 to 80 prior below is a
; spacing of 0.5 solar masses, which is converged to about 0.5 in the log
; likelihood for this signal; 40 points (1.0 solar masses) is off by 5. Check
; this by raising mtotal_grid_num until the log likelihood stops moving.
marginalize_mtotal = True
mtotal_grid_num = 80

; Total mass of the single waveform that gets rescaled onto the grid. Defaults
; to the midpoint of the mtotal prior if not given.
fiducial_mtotal = 60

; The base model applies the detector response, so the sky location, time,
; polarization and distance have to be marginalized over (or held static).
marginalize_vector_params = tc, ra, dec, polarization
marginalize_vector_samples = 500

; You shouldn't use phase marginalization if the approximant has
; higher-order modes
marginalize_phase = True

marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_snr_range = 5, 50
marginalize_distance_density = 100, 100
marginalize_distance_samples = 1000

[data]
instruments = H1 L1
trigger-time = 1126259462.43
analysis-start-time = -4
analysis-end-time = 1
psd-estimation = median-mean
psd-start-time = -256
psd-end-time = 256
psd-inverse-length = 8
psd-segment-length = 8
psd-segment-stride = 4
injection-file = injection.hdf
fake-strain = aLIGOZeroDetLowPower
fake-strain-sample-rate = 2048
channel-name = H1:GWOSC-4KHZ_R1_STRAIN L1:GWOSC-4KHZ_R1_STRAIN
sample-rate = 2048
strain-high-pass = 15
pad-data = 8

[sampler]
name = dynesty
dlogz = 1.0
nlive = 200

[variable_params]
; mtotal is marginalized over by the model, but it still needs a prior so that
; the grid can be placed across its bounds
mtotal =
q =
inclination =
distance =
polarization =
ra =
dec =
tc =

[static_params]
approximant = IMRPhenomD
f_lower = 20
spin1z = 0
spin2z = 0

[prior-mtotal]
name = uniform
min-mtotal = 40
max-mtotal = 80

[prior-q]
name = uniform
min-q = 1
max-q = 3

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[prior-tc]
name = uniform
min-tc = 1126259462.35
max-tc = 1126259462.45

[prior-distance]
; following gives a uniform in volume
name = uniform_radius
min-distance = 100
max-distance = 3000

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle
