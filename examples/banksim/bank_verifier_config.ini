; Not tied to any real detector; this just labels output files.
[workflow-ifos]
h1 =

[workflow]
file-retention-level = all_triggers
; start-time/end-time are required when using pycbc_create_injections
; (below) to generate injections; they are not otherwise used.
start-time = 1000000000
end-time = 1000100000
; Path to the template bank to verify. Must be a sngl_inspiral XML or HDF
; template bank, as read by pycbc_banksim/pycbc.waveform.bank.TemplateBank.
; The default here (and everywhere else in this example) uses HDF, but XML
; works equally well for both the bank and the injection sets. Must be an
; absolute path: the workflow generator changes into --output-dir before
; resolving this option.
input-bank = /path/to/bank.hdf

[injection]
; Options for pycbc_create_injections. The parameter distributions
; themselves (masses, spins, sky location, etc.) are set in the separate
; config-files given below, not here -- see injection_priors.ini.
; time-step/time-window set the density and jitter of injections in time;
; applies to every injection set below unless overridden in a per-tag
; section, e.g. [injection-bns] for the "bns" tag.
; config-files must be an absolute path, for the same reason as input-bank
; above.
config-files = /path/to/injection_priors.ini
time-step = 1
time-window = 0

[executables]
injection = ${which:pycbc_create_injections}
splitinj = ${which:pycbc_hdf_splitinj}
splitbank = ${which:pycbc_hdf5_splitbank}
banksim = ${which:pycbc_banksim}
banksim_bank_combine = ${which:pycbc_banksim_combine_banks}
banksim_match_combine = ${which:pycbc_banksim_match_combine}
banksim_table_point_injs = ${which:pycbc_banksim_table_point_injs}
banksim_plot_eff_fitting_fac = ${which:pycbc_banksim_plot_eff_fitting_factor}
banksim_plot_fitting_factors = ${which:pycbc_banksim_plot_fitting_factors}
page_versioning = ${which:pycbc_page_versioning}
results_page = ${which:pycbc_make_html_page}

[splitbank]

[splitinj]

[page_versioning]

; One entry per named point-injection set: tag = number-of-injections.
; Point-injection sets are small, targeted populations (e.g. at a single
; mass pair) used to check recovery at specific points in parameter space.
[workflow-pointinjs]
bns = 2000

; One entry per named broad-injection set, same format as above. Broad
; sets cover a wide region of parameter space to check overall bank
; coverage (fitting factor vs. mass/spin).
[workflow-broadinjs]
bns = 10000

; Controls how the template bank is split up for the point-injection and
; broad-injection banksim jobs. Increase splittable-num-banks if jobs are
; running for too long.
[workflow-splittable-shortinjbanksplit]
splittable-exe-tag = splitbank
splittable-num-banks = 10

[workflow-splittable-broadinjbanksplit]
splittable-exe-tag = splitbank
splittable-num-banks = 10

; Controls how each injection set is split up before being distributed to
; banksim jobs.
[workflow-splittable-shortinjs]
splittable-exe-tag = splitinj
splittable-num-banks = 10

[workflow-splittable-broadinjs]
splittable-exe-tag = splitinj
splittable-num-banks = 10

[banksim]
psd-model = aLIGOZeroDetHighPower
psd-low-frequency-cutoff = 15
template-approximant = SEOBNRv4
template-start-frequency = 20
signal-approximant = SEOBNRv4
signal-start-frequency = 20
filter-low-frequency-cutoff = 20
filter-sample-rate = 4096
filter-signal-length = 256
mchirp-window = 0.1

[banksim_bank_combine]

[banksim_match_combine]

[banksim_table_point_injs]

; Each subsection adds one mass1-vs-mass2 effective fitting-factor plot of
; the point injection sets. Options are plot-title/plot-caption/log-axes/
; log-colorbar/filter-injections; see pycbc_banksim_plot_eff_fitting_factor
; --help.
[banksim_plot_eff_fitting_fac]

[banksim_plot_eff_fitting_fac-mass1_mass2]

; Each subsection adds one fitting-factor distribution plot for both the
; point- and broad-injection sets. Options are plot-title/plot-caption/
; filter-injections; see pycbc_banksim_plot_fitting_factors --help.
[banksim_plot_fitting_factors]

[banksim_plot_fitting_factors-distribution]

[results_page]
output-path = html

[pegasus_profile]
condor|accounting_group = ligo.dev.o4.cbc.bankverification.pycbcoffline
condor|request_disk = 4096
condor|request_memory = 2048
pycbc|primary_site = condorpool_symlink
