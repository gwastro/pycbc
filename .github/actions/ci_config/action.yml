name: CI config
description: "Shared CI configuration: default Python version, Python test matrix and cibuildwheel selector."

inputs:
  python_version:
    description: "Default Python version to use in workflows"
    required: false
    default: '3.11'

  python_versions_matrix:
    description: "Python versions for test matrices (JSON array)"
    required: false
    default: '["3.11", "3.12", "3.13", "3.14"]'

runs:
  using: composite
  steps:
    - id: set
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
        PYTHON_VERSIONS_MATRIX: ${{ inputs.python_versions_matrix }}
      run: |
        echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
        echo "python_versions_matrix=$PYTHON_VERSIONS_MATRIX" >> "$GITHUB_OUTPUT"
        # cibuildwheel selector covering the matrix, e.g. "cp311-* cp312-*"
        CIBW_BUILD=$(jq -er 'map("cp" + sub("\\."; "") + "-*") | join(" ")' <<< "$PYTHON_VERSIONS_MATRIX")
        echo "cibw_build=$CIBW_BUILD" >> "$GITHUB_OUTPUT"
      shell: bash

outputs:
  python_version:
    description: "Python version string"
    value: ${{ steps.set.outputs.python_version }}
  python_versions_matrix:
    description: "Python test matrix as a JSON array"
    value: ${{ steps.set.outputs.python_versions_matrix }}
  cibw_build:
    description: "cibuildwheel CIBW_BUILD selector for the Python test matrix"
    value: ${{ steps.set.outputs.cibw_build }}
