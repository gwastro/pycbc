name: refresh CI caches

# GitHub removes any Actions cache that has not been read for 7 days.  The
# download cache is written by the test jobs, so on a quiet week it would
# expire and the next run would fetch everything from the origin servers --
# exactly the flaky path it exists to avoid.
#
# Reading a cache counts as an access and resets its timer, so this job starts
# the cache and stops it again, and does nothing else.  Starting it restores
# the cache, which is the access that matters.
#
# There is deliberately no list of files to prefetch.  If the cache has been
# evicted anyway, the next run on the default branch fills it by recording,
# which is the same path that filled it in the first place.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-ci-caches
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: ahnitz/github-ci-cache@v1
      - uses: ahnitz/github-ci-cache/report@v1
        if: always()
