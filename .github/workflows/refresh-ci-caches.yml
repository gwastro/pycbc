name: refresh CI caches

# GitHub removes any Actions cache that has not been read for 7 days.  The
# download cache is written by the test jobs, so on a quiet week it would
# expire and the next run would fall back to fetching everything from the
# origin servers -- exactly the flaky path it exists to avoid.
#
# Reading a cache counts as an access and resets its timer, so this job runs
# daily and does nothing else.  There is deliberately no list of files to
# prefetch: if the cache has already been evicted, the next run on the default
# branch repopulates it by recording, which is the same path that filled it in
# the first place.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-ci-caches
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      # The path must match the one the test jobs use, because a cache action
      # hashes it into the cache's identity -- see the action's state-dir input.
      - name: Touch the download cache
        id: touch
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          key: http-cache-
          restore-keys: http-cache-
          path: ~/.cache/github-ci-cache/cache

      - name: Say what was found
        run: |
          if [ -n "${{ steps.touch.outputs.cache-matched-key }}" ]; then
            entries=$(find ~/.cache/github-ci-cache/cache -mindepth 1 -maxdepth 1 -type d | wc -l)
            size=$(du -sh ~/.cache/github-ci-cache/cache | cut -f1)
            echo "::notice::refreshed ${{ steps.touch.outputs.cache-matched-key }} -- $entries entries, $size"
          else
            echo "::notice::no download cache to refresh; the next run on the default branch will record one"
          fi
