name: refresh CI caches

# Restores the download cache and stops, so it is read at least weekly.
# GitHub evicts an Actions cache that has gone 7 days without an access.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-ci-caches
  cancel-in-progress: true

env:
  # Point curl and wget at the shared retry/hardening config in tools/.
  # (Running the example scripts directly, without these set, is fine -
  # they just fall back to curl/wget defaults.)
  CURL_HOME: ${{ github.workspace }}/tools
  WGETRC: ${{ github.workspace }}/tools/.wgetrc

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: ahnitz/github-ci-cache@v1
      - uses: ahnitz/github-ci-cache/report@v1
        if: always()
