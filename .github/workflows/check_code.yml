name: Code quality checks
on:
    pull_request:
    workflow_dispatch:
defaults:
    run:
        shell: bash
jobs:
    flake8_unused_imports:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: 3.11
            - name: Install flake8
              run: pip install flake8
            - name: Build file list
              id: filelist
              uses: ./.github/actions/code-formatting-files
              with:
                  changed-only: ${{ github.event_name == 'pull_request' }}
                  base-ref: ${{ github.event.pull_request.base.sha }}
                  head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Check for unused imports (F401)
              if: steps.filelist.outputs.file-count != '0'
              env:
                  FILE_LIST: ${{ steps.filelist.outputs.file-list }}
              run: |
                  mapfile -t files < "$FILE_LIST"
                  flake8 --select=F401 "${files[@]}" | tee flake8-F401.txt
            - name: Check for undefined variables / missing imports (F821)
              if: ${{ !cancelled() && steps.filelist.outputs.file-count != '' && steps.filelist.outputs.file-count != '0' }}
              env:
                  FILE_LIST: ${{ steps.filelist.outputs.file-list }}
              run: |
                  mapfile -t files < "$FILE_LIST"
                  flake8 --select=F821 "${files[@]}" | tee flake8-F821.txt

            - name: Store Flake8 reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: flake8-reports
                  path: flake8-*.txt
                  if-no-files-found: ignore
                  retention-days: 30

    qlty_check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Install Qlty CLI
              uses: qltysh/qlty-action/install@v2

            - name: Build file list
              id: filelist
              uses: ./.github/actions/code-formatting-files
              with:
                  changed-only: ${{ github.event_name == 'pull_request' }}
                  base-ref: ${{ github.event.pull_request.base.sha }}
                  head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Run Qlty check
              if: steps.filelist.outputs.file-count != '0'
              env:
                  FILE_LIST: ${{ steps.filelist.outputs.file-list }}
              run: |
                mapfile -t files < "$FILE_LIST"
                set +e
                qlty check --sarif --no-progress \
                  -- "${files[@]}" \
                  > qlty-raw.sarif
                qlty_exit_code=$?
                set -e

                # Qlty's SARIF output includes fields GitHub's stricter validator
                # rejects (upload-sarif then fails even when qlty itself succeeded).
                # Known upstream issue: https://github.com/qltysh/qlty/issues/2701
                # `fixes` is dropped too: Qlty puts `replacements` directly on
                # fixes[], but GitHub requires it nested under
                # fixes[].artifactChanges[].replacements. Dropping it only loses
                # the inline "apply suggested fix" button, not the finding itself.
                jq 'del(.runs[].tool.driver.notifications)
                    | del(.runs[].results[].taxa[].name)
                    | del(.runs[].results[].fixes)' \
                  qlty-raw.sarif > qlty-results.sarif

                exit $qlty_exit_code

            - name: Store Qlty reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: qlty-reports
                  path: qlty-*.sarif
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Upload results to GitHub Code Scanning
              if: ${{ !cancelled() && hashFiles('qlty-results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: qlty-results.sarif

