name: Code Checks
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    flake8_unused_imports:
        name: Flake8 Unused Imports
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: 3.11
            - name: Install flake8
              run: pip install flake8
            - name: Checking executables for unused imports
              run: flake8 --select=F401 $(find bin -type f -name pycbc_*)
            - name: Checking modules for unused imports
              run: |
                flake8 --select=F401 $(find pycbc | grep '\.py$' | grep -v -e __init__ -e 'version.py')
            - name: Checking tests for unused imports
              run: |
                flake8 --select=F401 $(find test | grep '\.py$' | grep -v test_schemes)

    qlty_check:
        name: Qlty Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  # Full history is needed so Qlty can diff against the PR base branch.
                  fetch-depth: 0

            - name: Install Qlty CLI
              uses: qltysh/qlty-action/install@v2

            - name: Run Qlty check
              run: |
                set +e
                qlty check --sarif --no-progress \
                  --upstream origin/${{ github.event.pull_request.base.ref }} \
                  > qlty-raw.sarif
                qlty_exit_code=$?
                set -e

                # Qlty's SARIF output includes fields GitHub's stricter validator
                # rejects (upload-sarif then fails even when qlty itself succeeded).
                # Known upstream issue: https://github.com/qltysh/qlty/issues/2701
                # `fixes` is dropped too: Qlty puts `replacements` directly on
                # fixes[], but GitHub requires it nested under
                # fixes[].artifactChanges[].replacements. Dropping it only loses
                # the inline "apply suggested fix" button, not the finding itself.
                jq 'del(.runs[].tool.driver.notifications)
                    | del(.runs[].results[].taxa[].name)
                    | del(.runs[].results[].fixes)' \
                  qlty-raw.sarif > qlty-results.sarif

                exit $qlty_exit_code

            - name: Upload results to GitHub Code Scanning
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: qlty-results.sarif

    coverage:
      name: Coverage
      runs-on: ubuntu-latest
      # Run on push to master OR on pull_request when the PR has the 'coverage' label
      if: >
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'coverage') && (needs.flake8_unused_imports.result == 'success' || needs.flake8_unused_imports.result == 'skipped'))

      needs: flake8_unused_imports
      steps:
        - name: Check out repository
          uses: actions/checkout@v5
        - name: Setup Pixi
          uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
          with:
            pixi-version: latest
        - name: Cache LAL auxiliary data files
          id: cache-lal-aux-data
          uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
          with:
            key: lal-aux-data
            path: ~/lal_aux_data
        - if: ${{ steps.cache-lal-aux-data.outputs.cache-hit != 'true' }}
          name: Download LAL auxiliary data files
          run: |
            mkdir ~/lal_aux_data
            pushd ~/lal_aux_data
            curl --show-error --silent \
              --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v2.0.hdf5 \
              --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v3.0.hdf5
            popd
        - name: Install dependencies and run tests with coverage
          run: |
            export LAL_DATA_PATH=$HOME/lal_aux_data
            pixi run python -m coverage run --source=pycbc -m pytest test
            pixi run python -m coverage html -d htmlcov
            pixi run python -m coverage report -m
        - name: Upload HTML coverage report
          uses: actions/upload-artifact@v4
          with:
            name: htmlcov
            path: htmlcov

