name: run small inference workflow using pegasus + condor

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: install condor
      run: |
        wget -qO - --tries=5 --retry-connrefused --waitretry=5 --timeout=30 https://research.cs.wisc.edu/htcondor/ubuntu/HTCondor-Release.gpg.key | sudo apt-key add -
        echo "deb http://research.cs.wisc.edu/htcondor/ubuntu/8.9/focal focal contrib" | sudo tee -a /etc/apt/sources.list
        echo "deb-src http://research.cs.wisc.edu/htcondor/ubuntu/8.9/focal focal contrib" | sudo tee -a /etc/apt/sources.list
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install minihtcondor
        bash tools/ci_start_condor.sh
    - name: install pegasus
      run: |
        wget -qO - --tries=5 --retry-connrefused --waitretry=5 --timeout=30 https://download.pegasus.isi.edu/pegasus/gpg.txt | sudo apt-key add -
        echo "deb https://download.pegasus.isi.edu/pegasus/ubuntu noble main" | sudo tee -a /etc/apt/sources.list
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install pegasus=5.1.1-1+ubuntu24
    - run: sudo apt-get -o Acquire::Retries=3 install *fftw3* intel-mkl*
    - name: Install pycbc
      run: |
        python -m pip install --upgrade pip setuptools
        pip install GitPython # This shouldn't really be needed!
        pip install -r requirements.txt
        pip install .
    - name: Start the download cache
      # These workflows reach GWOSC for data-quality segments through
      # pycbc.dq, and pull frames and banks over http.  The cache is what
      # makes that survive an unreachable origin, now that pycbc.io no longer
      # carries its own mirror list.
      uses: ahnitz/github-ci-cache@v1
      with:
        # TEMPORARY, while this branch is being tested: record so that the
        # pull request can populate the cache itself.  Change to "auto" before
        # merging.
        mode: record
        hosts: >-
          gwosc.org,gw-openscience.org,losc.ligo.org,dcc.ligo.org,zenodo.org,
          raw.githubusercontent.com,media.githubusercontent.com,
          github.com/gwastro/pycbc_data/releases/download/,
          github.com/gwastro/pycbc-config/raw/
    - name: retrieving data
      run: bash -e examples/inference/single/get.sh
    - name: generating, submitting and running workflow
      run: |
        cp examples/inference/single/single.ini ./
        cp examples/workflow/inference/small_test/*.ini ./
        bash -e examples/workflow/inference/small_test/gen.sh
        condor_status
        cd gw_output
        ./status
        python ../examples/search/check_job.py
        find submitdir/work/ -type f -name '*.tar.gz' -delete
    - name: Report the download cache
      if: always()
      uses: ahnitz/github-ci-cache/report@v1
    - name: store log files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs
        path: gw_output/submitdir/work
    - name: store result page
      uses: actions/upload-artifact@v7
      with:
        name: results
        path: html
