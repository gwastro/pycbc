name: tutorial tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  defaults:
    runs-on: ubuntu-24.04
    outputs:
      python_versions_matrix: ${{ steps.defaults.outputs.python_versions_matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Load defaults
        id: defaults
        uses: ./.github/actions/defaults

  build:
    needs: defaults
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 60
      matrix:
        os: [ubuntu-24.04]
        python_version: ${{ fromJSON(needs.defaults.outputs.python_versions_matrix) }}
    steps:
    - uses: actions/checkout@v5
    - name: Configure CI downloads
      uses: ./.github/actions/configure-downloads
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python_version }}

    - name: Install system dependencies
      uses: ./.github/actions/install-system-deps
    - name: installing packages
      run: |
        pip install tox pip setuptools notebook --upgrade
        pip install .
    - name: Cache remote test data
      uses: ./.github/actions/cache-test-data
    - name: retrieving pycbc tutorials
      run: |
        git clone https://github.com/gwastro/PyCBC-Tutorials
    - name: running pycbc tutorials
      run: |
        cd PyCBC-Tutorials
        ./test_notebooks
