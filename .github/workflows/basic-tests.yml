name: basic tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 60
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13']
        test-type: [unittest, search, docs]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
      with:
        pixi-version: latest

    - name: Inject Python Version
      run: |
        pixi add python="${{ matrix.python-version }}.*"

    - name: Start the download cache
      # Routes this job's data downloads through a caching proxy, so a file
      # that has been fetched before is served from disk and never touches the
      # network.  Replaces the per-directory caches, the prefetch manifest and
      # the mirror fall-backs that used to live in six places.
      uses: ahnitz/github-ci-cache@v1
      with:
        # TEMPORARY, while this branch is being tested: record so that the
        # pull request can populate the cache itself.  Change to "auto"
        # (record on master and schedules, strict on pull requests) before
        # merging.
        mode: record
        hosts: >-
          gwosc.org,gw-openscience.org,losc.ligo.org,dcc.ligo.org,zenodo.org,
          raw.githubusercontent.com,media.githubusercontent.com,
          github.com/gwastro/pycbc_data/releases/download/,
          github.com/gwastro/pycbc-config/raw/

    - name: Download LAL auxiliary data files
      # Unconditional now: the bytes come from the download cache, so there is
      # no separate cache of the unpacked files to hit or miss.
      #
      # SEOBNRv4ROM_v2.0.hdf5 used to be fetched here too and has been dropped:
      # it 404s, and it is not among the 85 files on that zenodo record under
      # any name -- lalsuite publishes v3.0 now.  Nobody noticed because on
      # master this step only runs when the lal-aux-data cache misses, and that
      # cache has been warm for months, so it still holds a copy of a file that
      # can no longer be downloaded.  Making the fetch unconditional is what
      # surfaced it.
      #
      # The --retry
      # flags stay because the cache is allowed to be absent -- in record mode
      # a proxy that cannot start warns and lets the job download directly,
      # and this is then the only thing standing between a momentary zenodo
      # blip and a failed job.
      run: |
        mkdir -p ~/lal_aux_data
        pushd ~/lal_aux_data
        curl --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors --fail \
          --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v3.0.hdf5
        popd

    - name: run pycbc test suite
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e ${{matrix.test-type}} test-${{matrix.test-type}}

    - name: check help messages work
      if: matrix.test-type == 'unittest'
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e help test-help

    - name: run inference tests
      if: matrix.test-type == 'search'
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e inference test-inference

    - name: Report the download cache
      # if: always() so the counts are reported when the job failed, which is
      # when they are most worth reading.
      if: always()
      uses: ahnitz/github-ci-cache/report@v1

    - name: store documentation page
      if: matrix.test-type == 'docs' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: documentation-page
        path: _gh-pages

  deploy_documentation:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
    - name: retrieve built documentation
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: documentation-page
    - name: debug
      run: |
        mkdir _gh-pages
        mv latest _gh-pages
    - name: deploying to gh-pages
      uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505 # v3.7.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: _gh-pages
        SINGLE_COMMIT: true