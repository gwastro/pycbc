[variable_params]
amp220 =
amp330 =
phi330 =
final_mass =
final_spin =
ra =
dec =
inclination =
polarization =
delta_tc =

[static_params]
lmns = 221 331
f_lower = 5.0
f_ref = 5.0
trigger_time = 1242442967.445
approximant = TdQNMfromFinalMassSpin
phi220 = 0.

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc

[waveform_transforms-t_gate_start]
name = custom
inputs = tc
t_gate_start = tc - 1.

[waveform_transforms-t_gate_end]
name = custom
inputs = tc
t_gate_end = tc

[prior-final_mass]
name = uniform
min-final_mass = 10
max-final_mass = 500

[prior-final_spin]
name = uniform
min-final_spin = -0.99
max-final_spin = 0.99

[prior-amp220]
name = uniform_log10
min-amp220 = 1e-24
max-amp220 = 1e-18

[prior-amp330]
name = uniform
min-amp330 = 0.
max-amp330 = 0.9

[prior-phi330]
name = uniform_angle
cyclic_domain =

[prior-ra+dec]
name = uniform_sky

[prior-inclination]
name = sin_angle

[prior-polarization]
name = uniform_angle

[prior-delta_tc]
name = uniform
min-delta_tc = -0.05
max-delta_tc = 0.05

[data]
instruments = H1 L1
trigger-time = 1242442967.445
analysis-start-time = -2
analysis-end-time = 2
pad-data = 8
psd-model = H1:aLIGOZeroDetHighPower L1:aLIGOZeroDetHighPower
psd-inverse-length = 8
psd-segment-length = 8
psd-segment-stride = 4
psd-low-frequency-cutoff = H1:6.0 L1:6.0
strain-high-pass = 10
sample-rate = 2048
fake-strain = H1:zeroNoise L1:zeroNoise             
channel-name = H1:STRAIN L1:STRAIN
injection-file = injection.hdf

[sampler]
name = dynesty
dlogz = 0.1
nlive = 2048
checkpoint_time_interval = 1800

[model]
name = gated_gaussian_margphase
low-frequency-cutoff = H1:20.0 L1:20.0
ref_phase = phi220
phase_names = phi220 phi330
paint-method = matmul
