# Ruff config for the qlty_check CI job (.github/workflows/check_code.yml).
#
# Qlty's ruff plugin only auto-recognizes a file named `ruff.toml` for
# configuration (not `pyproject.toml`), so rule selection lives here rather
# than in pyproject.toml.

[lint]
select = [
    # pycodestyle / Pyflakes / isort baseline
    "E4", "E7", "E9", "E101", "E501",
    "W",
    "F",
    "I",
    # pydocstyle (scoped by the numpy convention below)
    "D",
    # flake8-bugbear
    "B",
    # Bug-prone / correctness
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "PLE",    # Pylint (error)
    "TRY",    # tryceratops (exception-handling anti-patterns)
    "ASYNC",  # flake8-async (blocking calls in async def)
    "DTZ",    # flake8-datetimez (naive datetime usage)
    "ISC",    # flake8-implicit-str-concat
    "PGH",    # pygrep-hooks
    "YTT",    # flake8-2020 (sys.version_info comparisons)
    # Style / simplification / modernization
    "RUF",    # Ruff-specific rules
    "UP",     # pyupgrade
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "FURB",   # refurb
    "C4",     # flake8-comprehensions
    "N",      # pep8-naming
    "PLW",    # Pylint (warning)
    "PLR",    # Pylint (refactor)
    "PLC",    # Pylint (convention)
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "Q",      # flake8-quotes
    "ICN",    # flake8-import-conventions
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "ERA",    # eradicate (commented-out code)
    "FLY",    # flynt
    "RSE",    # flake8-raise
    "SLF",    # flake8-self
    "ARG",    # flake8-unused-arguments
    "EXE",    # flake8-executable
    "INP",    # flake8-no-pep420
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "G",      # flake8-logging-format
    "LOG",    # flake8-logging
    "ANN",    # flake8-annotations
    # Domain-specific
    "PD",     # pandas-vet
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    # Test style
    "PT",     # flake8-pytest-style
]

# numpy convention excludes D107/D212/D213/D402/D413/D415/D416/D417 by
# default. We want D213, plus D107/D402/D413/D416/D417
# -- all re-enabled explicitly since `select` above
# doesn't override convention filtering (see the `extend-select` docs).
# D212 (conflicts with D213) and D415 (redundant with D400, which is already
# on) are deliberately left off.
extend-select = ["D213", "D107", "D402", "D413", "D416", "D417"]

# Rule families selected above but ignored here. Some of this is things that
# genuinely are not helpful (too-many-branches etc.), other things are disabled
# to avoid noise while higher-priority issues are dealt with.
# For example, we do need to add type-hints to the code, but that's a huge job
# (ANN here). Removing an entry will report all of its findings.
ignore = [
    # Type annotations: the codebase predates type hints and adding them is a
    # large job we are not taking on at this stage.
    "ANN",
    # Docstrings: wanted, but deferred until higher-priority issues are fixed.
    # The specific D codes from `extend-select` must be listed too, as an
    # explicitly selected code otherwise takes precedence over ignoring "D".
    "D", "D107", "D213", "D402", "D413", "D416", "D417",
    # Not planned to be enabled: function size/complexity limits (too many
    # arguments, branches, statements, return statements) are left to qlty's
    # own smells checks (see .qlty/qlty.toml), and replacing every literal in a
    # comparison with a named constant (magic values) hurts readability in
    # numerical code.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    # Not planned to be enabled: unittest-style assertions (assertEqual,
    # assertRaises, ...). The tests are unittest.TestCase classes run both by
    # pytest and as scripts (with --scheme for cpu/cuda); plain asserts would
    # lose their failure details outside pytest, and pytest.raises would make
    # pytest a hard dependency of every test file.
    "PT009", "PT027",
    # Not planned to be enabled: shebang in a file that is not executable.
    # The bin/ scripts are installed by setup.py (`scripts=`), which makes
    # them executable, so their mode in git does not matter.
    "EXE001",
]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
# Declare pycbc explicitly as first-party. Otherwise ruff decides per module
# by looking for the file, and pycbc/version.py only exists after a build, so
# `import pycbc.version` would be sorted differently in a fresh checkout (such
# as CI) than in a built one.
known-first-party = ["pycbc"]
